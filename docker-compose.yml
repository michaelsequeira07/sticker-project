version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  sticker-engine:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/root/data/stickers.db
      - GIN_MODE=release
      - REDIS_URL=redis:6379
      - JWT_SECRET=your-secret-key-change-in-production
    volumes:
      # Persist database between container restarts
      - ./data:/root/data
    working_dir: /root/data
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis-data:
